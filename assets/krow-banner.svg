<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Krow — Technical Strategist and AI Agent</title>
  <desc id="desc">A dark editorial banner with a geometric crow mark, Krow wordmark, and the phrase Observe, Act, Verify, Reflect.</desc>
  <defs>
    <linearGradient id="bg" x1="74" y1="19" x2="1120" y2="398" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0B0F"/>
      <stop offset="0.56" stop-color="#111118"/>
      <stop offset="1" stop-color="#17111B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 63) rotate(143.3) scale(425 272)">
      <stop stop-color="#9D75FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9D75FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="89" y1="84" x2="326" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B89CFF"/>
      <stop offset="1" stop-color="#7256C7"/>
    </linearGradient>
    <linearGradient id="beak" x1="279" y1="121" x2="357" y2="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB68F"/>
      <stop offset="1" stop-color="#E57A55"/>
    </linearGradient>
    <filter id="shadow" x="51" y="46" width="331" height="318" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="white" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="398" rx="27" stroke="white" stroke-opacity="0.1" stroke-width="2"/>
  <path d="M414 42V358" stroke="white" stroke-opacity="0.08"/>
  <rect x="414" y="42" width="744" height="316" fill="url(#grid)" opacity="0.8"/>

  <g filter="url(#shadow)">
    <circle cx="215" cy="200" r="132" fill="#14141B" stroke="white" stroke-opacity="0.09" stroke-width="2"/>
    <path d="M127 282C137 236 153 202 178 177C181 139 202 111 235 101C263 92 287 99 307 119C327 139 334 164 327 193C318 231 288 260 238 279C203 292 166 293 127 282Z" fill="url(#wing)"/>
    <path d="M182 178C172 216 177 250 198 281C166 294 136 293 107 282C127 229 152 194 182 178Z" fill="#8668DD"/>
    <path d="M196 281C223 258 245 229 261 193C263 230 255 267 237 304L196 281Z" fill="#5D469D"/>
    <path d="M300 126L361 154L319 175C316 153 310 137 300 126Z" fill="url(#beak)"/>
    <circle cx="274" cy="139" r="9" fill="#0B0B0F"/>
    <circle cx="277" cy="136" r="3" fill="#F7F3EC"/>
    <path d="M152 280L127 321L182 289" stroke="#A98AF7" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="472" y="102" fill="#A98AF7" font-size="17" font-weight="600" letter-spacing="3.4">KROW / 크로 / 까망이</text>
    <text x="468" y="198" fill="#F6F3F8" font-size="86" font-weight="650" letter-spacing="-4">Technical</text>
    <text x="468" y="276" fill="#F6F3F8" font-size="86" font-weight="650" letter-spacing="-4">strategist.</text>
    <text x="474" y="323" fill="#AAA5B2" font-size="22" font-weight="400" letter-spacing="0.1">Observe · Act · Verify · Reflect</text>
  </g>

  <g transform="translate(1047 313)">
    <circle cx="0" cy="0" r="6" fill="#78D7A8"/>
    <text x="18" y="6" fill="#C7C2CC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">WITH LONEL</text>
  </g>
</svg>
